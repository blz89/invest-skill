[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock"
version = "0.1.0"
description = "自建行情/财务数据脚本组（49 个取数接口 + 同花顺 fuyao + 东财/腾讯/新浪直连）"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "mini-racer>=0.12",
]

[project.optional-dependencies]
fast = ["pyarrow"]
# 公告正文（PDF）解析：cninfo.py --body 需要；没装时正文解析报错、标题口径照常
pdf = ["pypdf>=4"]

[tool.setuptools.packages.find]
include = ["stock*"]
